<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff3a3a">
<title>音乐下载 · 网易云 / QQ / 酷狗</title>
<style>
:root{--bg:#f5f6fa;--bg2:#eceef6;--card:rgba(255,255,255,.88);--fg:#14161c;--sub:#6b7180;--line:rgba(20,22,28,.08);
--acc:#ff3a3a;--acc2:#ff7a45;--ok:#12a150;--radius:18px;--shadow:0 10px 30px rgba(30,35,60,.08)}
[data-theme=dark]{--bg:#0e1015;--bg2:#090a0e;--card:rgba(28,31,40,.85);--fg:#eef0f5;--sub:#9aa1b0;--line:rgba(255,255,255,.08);
--acc:#ff4d4d;--acc2:#ff9052;--ok:#3ddc84;--shadow:0 12px 34px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--fg);
background:radial-gradient(1200px 600px at 10% -10%,rgba(255,58,58,.16),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(90,120,255,.14),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));
background-attachment:fixed;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;
padding:calc(12px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;padding:4px 2px 16px}
.logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;
background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 20px rgba(255,58,58,.35)}
.top h1{font-size:18px;margin:0}.top .sub{font-size:12.5px;color:var(--sub)}.top .spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;backdrop-filter:blur(16px)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.card-h .t{font-weight:700;display:flex;align-items:center;gap:8px}
.card-h .t .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(255,58,58,.14)}
.plats{display:flex;gap:8px;margin-bottom:14px;background:rgba(20,22,28,.05);padding:5px;border-radius:16px}
[data-theme=dark] .plats{background:rgba(255,255,255,.06)}
.plats button{flex:1;padding:11px 8px;border-radius:12px;background:transparent;color:var(--sub);border:none;font-weight:650;font-size:14px;cursor:pointer;font-family:inherit}
.plats button.on{background:var(--card);color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.10)}
.plats .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px;opacity:.25}
.plats .live.on{opacity:1}
input[type=text],textarea{width:100%;font:inherit;color:inherit;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(125,125,125,.08);outline:none}
textarea{min-height:96px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,58,58,.12)}
button{font:inherit;cursor:pointer;border:none;border-radius:14px;padding:13px 18px;font-weight:650;color:#fff;white-space:nowrap;
background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 18px rgba(255,58,58,.28)}
button:disabled{opacity:.55;box-shadow:none}
button.ghost{background:rgba(125,125,125,.10);color:var(--fg);box-shadow:none;border:1px solid var(--line);font-weight:600}
button.small{padding:8px 12px;font-size:13px;border-radius:11px}
button.tiny{padding:6px 10px;font-size:12px;border-radius:9px}
.input-row{display:flex;gap:8px}input[type=text]{flex:1;min-width:0}
.quality{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.quality button{background:rgba(125,125,125,.10);color:var(--sub);border:1px solid var(--line);box-shadow:none;padding:8px 13px;font-size:13px;border-radius:999px}
.quality button.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
.qr-frame{position:relative;width:min(340px,86vw,100%);aspect-ratio:1;margin:6px auto 12px;border-radius:22px;background:#fff;padding:10px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.qr-frame svg{position:absolute;inset:10px;width:calc(100% - 20px)!important;height:calc(100% - 20px)!important;display:block;border-radius:12px}
.qr-overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(255,255,255,.92);border-radius:22px;color:#222;font-weight:700;font-size:14px}
.qr-overlay.show{display:grid}
.qr-hint{color:var(--sub);font-size:13px;text-align:center;min-height:22px}
.qr-hint b{color:var(--fg)}.qr-hint.ok{color:var(--ok);font-weight:700}
.steps{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.steps span{font-size:11.5px;color:var(--sub);background:rgba(125,125,125,.10);padding:4px 9px;border-radius:999px}
.song{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px}
.song:hover{background:rgba(125,125,125,.06)}
.song .cover{width:46px;height:46px;border-radius:11px;object-fit:cover;background:rgba(125,125,125,.15);flex:none}
.song .m{flex:1;min-width:0}
.song .tt{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .dd{color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .acts{display:flex;gap:6px;flex:none}
.list-head{display:flex;justify-content:space-between;margin:4px 0 10px;gap:10px}
.list-head .l{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-head .r{color:var(--sub);font-size:12.5px}
.url-line{font-size:12px;color:var(--sub);margin:2px 0 6px 58px;word-break:break-all}
.url-line a{color:var(--acc);text-decoration:none}
.empty{color:var(--sub);text-align:center;padding:18px 6px;font-size:13.5px}
.err{color:var(--acc);font-size:13px;margin-top:10px;background:rgba(255,58,58,.08);padding:10px 12px;border-radius:12px}
.hide{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.center{display:flex;align-items:center;justify-content:center;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(20,22,28,.92);color:#fff;
padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.help{color:var(--sub);font-size:12.5px;line-height:1.75;margin:8px 0 12px}
.help code{background:rgba(125,125,125,.14);padding:1px 5px;border-radius:5px;font-size:12px}
.foot{text-align:center;color:var(--sub);font-size:11.5px;margin-top:18px;line-height:1.7}
.user{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:rgba(125,125,125,.15);flex:none}
.user .n{font-weight:700}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,58,58,.12);color:var(--acc);font-weight:700;margin-left:6px}
.badge.g{background:rgba(18,161,80,.14);color:var(--ok)}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px}
.modal.hide{display:none}
.modal-mask{position:absolute;inset:0;background:rgba(10,12,18,.55)}
.modal-box{position:relative;width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:12px}
.dtabs{display:flex;gap:8px;background:rgba(125,125,125,.10);padding:4px;border-radius:14px;margin-bottom:12px}
.dtabs button{flex:1;padding:9px;border-radius:11px;background:transparent;color:var(--sub);box-shadow:none;font-weight:650;font-size:13.5px}
.dtabs button.on{background:var(--card);color:var(--fg)}
.helpbox{max-height:56vh;overflow:auto;font-size:13.5px;line-height:1.85}
.helpbox ol{padding-left:20px}.helpbox code{background:rgba(125,125,125,.14);padding:1px 5px;border-radius:5px}
.helpbox .k{color:var(--acc);font-weight:700}
.sponsor-btn{height:38px;padding:0 14px;border-radius:12px;color:#fff;font-size:13.5px;font-weight:700;letter-spacing:2px;
background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 16px rgba(255,58,58,.28);white-space:nowrap;flex:none}
.sponsor-btn:active{transform:scale(.96)}
.dtitle{text-align:center;font-size:20px;font-weight:800;letter-spacing:6px;margin:2px 0 12px}
.dimg-box{position:relative;display:grid;place-items:center;min-height:220px;border-radius:16px;background:#fff;padding:10px}
.dimg-box img{max-width:100%;max-height:min(52vh,340px);border-radius:10px;display:none}
.dempty{color:#b9bec9;font-size:28px;font-weight:800;letter-spacing:8px}
.dnote{text-align:center;color:var(--sub);font-size:12px;margin-top:10px}
.applogin{width:100%;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo" id="brandLogo">♪</div>
    <div><h1 id="brandTitle">音乐下载</h1><div class="sub" id="brandSub">网易云 / QQ 音乐 / 酷狗</div></div>
    <div class="spacer"></div>
    <button class="sponsor-btn" id="btnDonate">赞助</button>
    <button class="icon-btn" id="btnTheme" title="深浅色">◐</button>
  </div>

  <div class="plats" id="plats">
    <button data-p="netease" class="on"><span class="live" id="dot-netease"></span>网易云</button>
    <button data-p="qq"><span class="live" id="dot-qq"></span>QQ 音乐</button>
    <button data-p="kg"><span class="live" id="dot-kg"></span>酷狗</button>
  </div>

  <div class="card" id="qrCard">
    <div class="card-h"><div class="t"><span class="dot"></span>扫码登录</div></div>
    <div class="qr-frame" id="qrFrame"><div class="qr-overlay" id="qrOverlay"><div id="qrOverlayText">二维码已失效</div></div></div>
    <div class="qr-hint" id="qrHint">正在生成二维码…</div>
    <button class="applogin" id="btnAppLogin">📱 就在这台手机上登录</button>
    <div class="help" style="text-align:center;margin:8px 0 0">装了网易云 App 的话，点上面的按钮会直接打开 App 确认登录</div>
    <div class="steps"><span>① 打开网易云 App</span><span>② 扫一扫</span><span>③ 确认登录</span></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="ghost small" id="btnRefreshQr" style="flex:1">刷新二维码</button>
      <button class="ghost small" id="btnQrLink" style="flex:1">显示链接</button>
    </div>
    <div class="url-line hide" id="qrLink" style="margin-left:0"></div>
  </div>

  <div class="card hide" id="cookieCard">
    <div class="card-h"><div class="t"><span class="dot"></span><span id="cookieTitle">登录</span></div>
      <button class="ghost small" id="btnCookieHelp">怎么取？</button></div>
    <div class="help" id="cookieHelp"></div>
    <div class="help" id="ncmFallbackTips" style="display:none">扫码一直失败？可以直接贴网易云 Cookie：手机浏览器登录 <code>music.163.com</code> 后取 <code>MUSIC_U=</code> 那一段。</div>
    <textarea id="cookieInput" placeholder="粘贴 Cookie，如 uin=o1234567; qm_keyst=xxxx"></textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button id="btnSaveCookie" style="flex:1">保存 Cookie</button>
      <button class="ghost" id="btnClearCookie">清除</button>
    </div>
  </div>

  <div class="card hide" id="userCard">
    <div class="card-h"><div class="t"><span class="dot"></span>账号</div><button class="ghost small" id="btnLogout">退出</button></div>
    <div id="userBox"></div>
  </div>

  <div class="card" id="dlCard">
    <div class="card-h"><div class="t"><span class="dot"></span>下载</div></div>
    <div class="input-row"><input id="q" type="text" placeholder="粘贴歌曲 / 歌单链接，或输入歌名" autocomplete="off"><button id="btnGo">搜索</button></div>
    <div class="quality" id="quality"></div>
    <div class="err hide" id="err"></div>
    <div id="results"></div>
  </div>

  <div class="foot">仅供下载自己有权收听的歌曲 · 登录态只存在你浏览器里</div>
</div>
<div class="toast" id="toast"></div>

<div class="modal hide" id="donateModal">
  <div class="modal-mask" id="donateMask"></div>
  <div class="modal-box">
    <div class="modal-h"><span>赞助</span><button class="icon-btn" id="donateClose" style="width:32px;height:32px;font-size:15px">✕</button></div>
    <div class="dtitle">赞赏码</div>
    <div class="dtabs" id="dtabs"><button data-k="wechat" class="on">微信</button><button data-k="alipay">支付宝</button></div>
    <div class="dimg-box"><img id="donateImg" alt="赞赏二维码"><div class="dempty" id="donateEmpty">赞赏码</div></div>
    <div class="dnote">长按图片识别 · 感谢支持 ♥</div>
  </div>
</div>

<div class="modal hide" id="helpModal">
  <div class="modal-mask" id="helpMask"></div>
  <div class="modal-box">
    <div class="modal-h"><span>怎么取 Cookie</span><button class="icon-btn" id="helpClose" style="width:32px;height:32px;font-size:15px">✕</button></div>
    <div class="dtabs" id="htabs"><button data-k="pc" class="on">电脑</button><button data-k="phone">手机</button></div>
    <div class="helpbox" id="helpBody"></div>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const BASE = location.pathname;
let token = localStorage.getItem('m_token') || '';
let sess = localStorage.getItem('m_sess') || '';
let platform = localStorage.getItem('m_platform') || 'netease';
let level = localStorage.getItem('m_level') || 'exhigh';
let lastList = [], pollTimer = null, qrLinkText = '';
let status = { netease:{loggedIn:false}, qq:{loggedIn:false}, kg:{loggedIn:false} };

const P = {
  netease:{title:'网易云音乐 · 离线下载', sub:'扫码登录 · 按账号权限下载', logo:'♪'},
  qq:{title:'QQ 音乐 · 离线下载', sub:'粘贴 Cookie · 按账号权限下载', logo:'♫'},
  kg:{title:'酷狗音乐 · 离线下载', sub:'免费歌曲直接下 · 会员贴 Cookie', logo:'♬'},
};
const LEVELS = {
  netease:[['standard','标准 128k'],['higher','较高 192k'],['exhigh','极高 320k'],['lossless','无损']],
  qq:[['standard','标准 128k'],['exhigh','极高 320k'],['lossless','无损 FLAC']],
  kg:[['standard','标准 128k']],
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur = ms => { if(!ms) return ''; const t = Math.round(ms/1000); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2400); }
function setErr(m){ const e=$('#err'); if(!m){e.classList.add('hide');return;} e.textContent=m; e.classList.remove('hide'); }

function authHeaders(base = {}){ const h = {...base}; if(sess) h['X-Sess']=sess; return h; }
function saveSess(b){ if(!b) return; sess=b; localStorage.setItem('m_sess', b); }

async function api(a, opt = {}){
  const h = authHeaders({ 'Content-Type':'application/json' });
  Object.assign(h, opt.headers || {});
  const sep = '&';
  const r = await fetch(BASE + '?a=' + a + sep + 'p=' + platform, { ...opt, headers: h });
  const j = await r.json().catch(() => ({ error: 'HTTP ' + r.status }));
  if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

/* 主题 */
function resolveTheme(t){ return t==='auto' ? (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : t; }
function applyTheme(t){ document.documentElement.setAttribute('data-theme', resolveTheme(t)); }
let theme = localStorage.getItem('m_theme') || 'auto';
applyTheme(theme);
$('#btnTheme').onclick = () => { theme = resolveTheme(theme)==='dark'?'light':'dark'; localStorage.setItem('m_theme',theme); applyTheme(theme); };

/* 平台 */
function applyBrand(){
  const p = P[platform];
  $('#brandTitle').textContent = p.title;
  $('#brandSub').textContent = p.sub;
  $('#brandLogo').textContent = p.logo;
  $$('#plats button').forEach(b => b.classList.toggle('on', b.dataset.p === platform));
  ['netease','qq','kg'].forEach(k => $('#dot-'+k).classList.toggle('on', !!(status[k] && status[k].loggedIn)));
  if(!LEVELS[platform].some(x => x[0] === level)) level = 'exhigh';
  renderQuality(); refreshUi();
}
function refreshUi(){
  const logged = !!(status[platform] && status[platform].loggedIn);
  const isQr = platform === 'netease';
  $('#qrCard').classList.toggle('hide', !(isQr && !logged));
  // 三个平台都显示 Cookie 卡片：网易云扫码失败时可以改用 Cookie 登录
  $('#cookieCard').classList.toggle('hide', logged);
  if(isQr) showNcmFallback(!$('#qrFrame').querySelector('svg'));
  $('#userCard').classList.toggle('hide', !logged);
  if(!logged){
    $('#cookieTitle').textContent = platform === 'qq' ? '登录 QQ 音乐'
      : platform === 'kg' ? '登录酷狗（可选）' : '改用 Cookie 登录（可选）';
    $('#cookieHelp').innerHTML = platform === 'qq'
      ? 'QQ 音乐没有可用的网页扫码接口，需要粘贴 Cookie（含 <code>uin=</code> 和 <code>qm_keyst=</code>）。'
      : platform === 'kg'
        ? '不贴 Cookie 也能下免费歌曲；会员/付费歌曲需要登录后的 Cookie（含 <code>userid=</code>、<code>token=</code>）。'
        : '扫码登不上时，可以贴网易云网页版的 Cookie，只要含 <code>MUSIC_U=</code> 这一段就行。';
  }
  if(logged){
    const me = status[platform];
    $('#userBox').innerHTML = `<div class="user">
      ${me.avatar?`<img class="avatar" src="${esc(me.avatar)}" alt="">`:`<div class="avatar" style="display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2))">${esc((me.nickname||'?').slice(0,1))}</div>`}
      <div><div class="n">${esc(me.nickname||'已登录')}<span class="badge ${me.vip?'':'g'}">${me.vip?'VIP':'普通'}</span></div>
      <div class="help" style="margin:0">${esc(P[platform].title.split(' · ')[0])}</div></div></div>`;
  }
  $('#q').placeholder = platform==='qq' ? '粘贴 QQ 音乐歌曲 / 歌单链接，或输入歌名'
    : platform==='kg' ? '粘贴酷狗歌曲链接，或输入歌名' : '粘贴网易云歌曲 / 歌单链接，或输入歌名';
}
function renderQuality(){
  $('#quality').innerHTML = LEVELS[platform].map(([k,l]) => `<button data-lv="${k}" class="${k===level?'on':''}">${l}</button>`).join('');
  $$('#quality button').forEach(b => b.onclick = () => { level=b.dataset.lv; localStorage.setItem('m_level',level); renderQuality(); });
}

/* 登录状态 */
async function refreshStatus(){
  try {
    const j = await fetch(BASE + '?a=status', { headers: authHeaders(), cache:'no-store' }).then(r => r.json());
    status = j;
  } catch(e){}
  applyBrand();
  if(platform==='netease' && !(status.netease && status.netease.loggedIn) && !document.querySelector('#qrFrame svg')) startQr();
}

/* 扫码 */
function paintQr(svg){
  const f = $('#qrFrame');
  [...f.querySelectorAll('svg')].forEach(n => n.remove());
  f.classList.remove('hide');
  if(!svg) return false;
  f.insertAdjacentHTML('afterbegin', svg);
  return true;
}
function setOverlay(show, text){
  const o = $('#qrOverlay');
  if (text) $('#qrOverlayText').textContent = text;
  o.classList.toggle('show', !!show);
}
const QR_KEY = 'm_qr_state';
function storeQr(o){ try{ localStorage.setItem(QR_KEY, JSON.stringify(o)); }catch(e){} }
function loadQr(){
  try{
    const j = JSON.parse(localStorage.getItem(QR_KEY) || 'null');
    if(!j || !j.token) return null;
    if(Date.now() - (j.ts||0) > 13*60*1000) return null;
    return j;
  }catch(e){ return null; }
}
function clearQr(){ try{ localStorage.removeItem(QR_KEY); }catch(e){} }

async function startQr(){
  clearInterval(pollTimer); pollTimer = null;
  [...$('#qrFrame').querySelectorAll('svg')].forEach(n => n.remove());
  setOverlay(false);
  $('#qrHint').innerHTML = '<span class="spin"></span> 正在生成二维码…';
  try{
    const r = await api('login_qr');
    paintQr(r.svg);
    qrLinkText = r.qrurl || '';
    if(!r.svg){
      $('#qrHint').innerHTML = '二维码生成失败<br><span style="font-size:12px">打开 ?a=diag 看诊断</span>';
      setOverlay(true); showNcmFallback(true); return;
    }
    $('#qrHint').innerHTML = '用手机<b>网易云音乐</b>扫一扫，然后在手机上点「确认登录」';
    window._qrToken = r.token;
    storeQr({ token: r.token, svg: r.svg, url: qrLinkText, ts: Date.now() });
    let ticks = 0;
    pollTimer = setInterval(() => { ticks++; check(r.token, ticks); }, 1500);
    check(r.token, 0);
  }catch(e){
    $('#qrHint').innerHTML = '生成失败：' + esc(e.message);
    setOverlay(true);
    showNcmFallback(true);
  }
}

function showNcmFallback(on){
  // 网易云也可以贴 Cookie，扫码不行时的备用方案
  const el = $('#ncmFallbackTips');
  if(el) el.style.display = on ? '' : 'none';
}

/** 回到页面时接着等原来那张二维码（不换新的） */
function resumeQr(){
  const st = loadQr();
  if(!st) return false;
  if(!paintQr(st.svg)) return false;
  qrLinkText = st.url || '';
  setOverlay(false);
  $('#qrHint').innerHTML = '还在等确认…（用<b>网易云音乐</b>点「确认登录」）';
  window._qrToken = st.token;
  clearInterval(pollTimer); pollTimer = null;
  pollTimer = setInterval(() => check(st.token, 1), 1500);
  check(st.token, 0);
  return true;
}
function tok(t){ window._qrToken = t; return t; }
async function check(t, ticks){
  if(!t) return;
  try{
    const j = await fetch(BASE + '?a=login_check&p=' + platform + '&token=' + encodeURIComponent(t), { cache:'no-store' }).then(r=>r.json());
    if(j.status === 'scanned'){
      $('#qrHint').innerHTML = '<b style="color:var(--ok)">已扫码</b>，请在手机上点「确认登录」…';
      setOverlay(false);
      // 注意：这里绝不能停轮询，否则永远收不到 803（登录成功）
      if(!pollTimer){
        pollTimer = setInterval(() => check(t, 2), 1500);
      }
    }
    else if(j.status === 'ok'){
      clearInterval(pollTimer); pollTimer = null;
      saveSess(j.sess);
      clearQr();
      // 直接用 803 的结果把界面切过去，不再等 /status（避免又被拉回登录页）
      status.netease = {
        loggedIn: true,
        nickname: j.nickname || '已登录',
        avatar: j.avatar || '',
        vip: !!j.vip,
        userId: j.userId || '',
      };
      applyBrand();
      $('#qrHint').innerHTML = '<span style="color:var(--ok);font-weight:700">登录成功 ✓</span>';
      setOverlay(false);
      toast('登录成功');
      // 立刻再取一次昵称/头像/VIP（803 里可能只拿到「已登录」）
      (async () => {
        try {
          const me = await fetch(BASE + '?a=me', { headers: authHeaders(), cache: 'no-store' }).then(r => r.json());
          if (me && me.loggedIn) { status.netease = me; applyBrand(); }
        } catch (e) { }
      })();
      setTimeout(refreshStatus, 1500);
    }
    else if(j.status === 'expired' || j.status === 'fail'){
      clearInterval(pollTimer); pollTimer = null;
      clearQr();
      $('#qrHint').textContent = j.error || '二维码已失效，点刷新';
      setOverlay(true, '二维码已失效');
    }
    else if(ticks && ticks % 6 === 0){ $('#qrHint').textContent = '仍在等待扫码…（15 分钟内有效）'; }
  }catch(e){}
}
$('#btnAppLogin').onclick = () => {
  if(!qrLinkText){ toast('二维码还没生成好，稍等'); return; }
  location.href = qrLinkText;   // 网易云 App 注册了这个链接，会直接唤起并弹「确认登录」
};
$('#btnRefreshQr').onclick = startQr;
$('#btnQrLink').onclick = () => {
  const l = $('#qrLink');
  l.classList.toggle('hide');
  l.innerHTML = `<a href="${esc(qrLinkText)}">${esc(qrLinkText)}</a>`;
};

/* Cookie */
$('#btnSaveCookie').onclick = async () => {
  const ck = $('#cookieInput').value.trim();
  if(!ck){ setErr('请先粘贴 Cookie'); return; }
  setErr('');
  const btn=$('#btnSaveCookie'); btn.disabled=true; const old=btn.textContent; btn.innerHTML='<span class="spin"></span>';
  try{
    const r = await fetch(BASE + '?a=set_cookie&p=' + platform, { method:'POST', headers: authHeaders({'Content-Type':'application/json'}), body: JSON.stringify({ platform, cookie: ck }) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || '保存失败');
    saveSess(j.sess);
    status = j;
    $('#cookieInput').value='';
    toast('Cookie 已保存');
    applyBrand();
  }catch(e){ setErr(e.message); }
  btn.disabled=false; btn.textContent=old;
};
$('#btnClearCookie').onclick = async () => {
  try{
    const r = await fetch(BASE + '?a=clear_cookie&p=' + platform, { method:'POST', headers: authHeaders({'Content-Type':'application/json'}), body: JSON.stringify({ platform }) });
    const j = await r.json(); saveSess(j.sess);
  }catch(e){}
  status[platform] = { loggedIn:false };
  applyBrand(); toast('已清除');
};
$('#btnLogout').onclick = async () => {
  clearInterval(pollTimer); pollTimer = null;
  try{ const j = await api('logout'); saveSess(j.sess); }catch(e){}
  status[platform] = { loggedIn:false };
  if(platform==='netease'){ sess=''; localStorage.removeItem('m_sess'); }
  applyBrand();
};

/* 赞赏：/1 = 微信，/2 = 支付宝（图片放仓库 public/1.png、public/2.png） */
let donateTab = 'wechat';
function renderDonate(){

  const empty = $('#donateEmpty');

$('#btnDonate').onclick = () => { $('#donateModal').classList.remove('hide'); renderDonate(); };
$('#donateClose').onclick = $('#donateMask').onclick = () => $('#donateModal').classList.add('hide');
$$('#dtabs button').forEach(b => b.onclick = () => { donateTab = b.dataset.k; renderDonate(); });

  phone:`<b>手机 Android</b><ol><li>装 <b>Kiwi Browser</b> 或狐猴浏览器</li><li>用它打开官网并登录</li><li>右上角 ⋮ → 开发者工具 → Network</li><li>刷新 → 点第一条请求 → Request Headers → Cookie，长按复制</li><li>回本页粘贴保存</li></ol>

$$('#htabs button').forEach(b => b.onclick = () => renderHelp(b.dataset.k));

/* 搜索/列表 */
function songRow(s, i){
  return `<div class="song" data-id="${esc(s.id)}">
    ${i?`<span class="help" style="width:20px;text-align:center;margin:0">${i}</span>`:''}
    <img class="cover" src="${esc(s.pic)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="m"><div class="tt">${esc(s.name)}</div><div class="dd">${esc(s.artists)}${s.album?' · '+esc(s.album):''}${s.duration?' · '+fmtDur(s.duration):''}</div></div>
    <div class="acts"><button class="ghost tiny" data-act="url">地址</button><button class="tiny" data-act="dl">下载</button></div>
  </div>`;
}
function renderResult(r){
  const box = $('#results');
  if(r.type==='search'){
    lastList = r.songs;
    box.innerHTML = r.songs.length
      ? `<div class="list-head"><span class="l">搜索「${esc(r.keywords)}」</span><span class="r">${r.songs.length} 首</span></div>` + r.songs.map(s=>songRow(s,0)).join('')
      : '<div class="empty">没有搜到</div>';
  } else if(r.type==='song'){ lastList=[r.song]; box.innerHTML = songRow(r.song,0); }
  else if(r.type==='list'||r.type==='playlist'){
    lastList = r.songs||[];
    box.innerHTML = `<div class="list-head"><span class="l">${r.type==='playlist'?esc(r.name):'共 '+lastList.length+' 首'}</span><span class="r">${lastList.length} 首</span></div>`
      + lastList.map((s,i)=>songRow(s,i+1)).join('');
  }
  $$('button[data-act]', box).forEach(b => b.onclick = () => {
    const row = b.closest('.song'), id = row.dataset.id;
    const song = lastList.find(x => x.id === id);
    if(b.dataset.act==='dl') downloadSong(id, b, song ? (song.artists ? song.artists + ' - ' : '') + song.name : ''); else showUrl(id,row,b);
  });
}
function dlUrl(id, name){
  let u = BASE + '?a=download&p='+platform+'&id='+encodeURIComponent(id)+'&level='+encodeURIComponent(level);
  if(name) u += '&name=' + encodeURIComponent(name);
  return u;
}
function triggerDownload(u){ const a=document.createElement('a'); a.href=u; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); }
function downloadSong(id, btn, name){
  btn.disabled=true; const old=btn.textContent; btn.innerHTML='<span class="spin"></span>';
  triggerDownload(dlUrl(id, name));
  toast('已开始下载');
  setTimeout(()=>{ btn.disabled=false; btn.textContent=old; },1500);
}
async function showUrl(id,row,btn){
  btn.disabled=true; const old=btn.textContent; btn.textContent='…';
  try{
    const r = await api('url',{method:'POST', body: JSON.stringify({id, level})});
    const line=document.createElement('div');
    line.className='url-line';
    line.innerHTML = `${esc(r.label||'')} · ${r.br?Math.round(r.br/1000)+' kbps':''} ${r.size?Math.round(r.size/1048576*10)/10+' MB':''}<br><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(String(r.url).slice(0,90))}…</a>`;
    row.after(line);
    btn.textContent='收起'; btn.disabled=false;
    btn.onclick = () => { line.remove(); btn.textContent=old; btn.onclick = () => showUrl(id,row,btn); };
  }catch(e){ setErr(e.message); btn.textContent=old; btn.disabled=false; }
}
$('#btnGo').onclick = async () => {
  const input = $('#q').value.trim();
  if(!input){ setErr('请输入歌名或链接'); return; }
  setErr(''); $('#results').innerHTML='<div class="empty center"><span class="spin"></span> 解析中…</div>';
  $('#btnGo').disabled=true;
  try{ renderResult(await api('resolve',{method:'POST', body: JSON.stringify({input, level})})); }
  catch(e){ setErr(e.message); $('#results').innerHTML=''; }
  $('#btnGo').disabled=false;
};
$('#q').addEventListener('keydown', e => { if(e.key==='Enter') $('#btnGo').click(); });
$$('#plats button').forEach(b => b.onclick = () => {
  platform = b.dataset.p;
  localStorage.setItem('m_platform', platform);
  setErr(''); $('#results').innerHTML=''; lastList=[];
  clearInterval(pollTimer); pollTimer=null;
  applyBrand();
  if(platform==='netease' && !status.netease.loggedIn) startQr();
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ clearInterval(pollTimer); pollTimer=null; return; }
  if(platform!=='netease' || status.netease.loggedIn) return;
  if(!$('#qrFrame').querySelector('svg') && window._qrToken){ check(window._qrToken, 1); pollTimer=setInterval(()=>check(window._qrToken,1),1800); }
});
applyBrand();
refreshStatus();
// 刚才为了跳 App 离开过页面的话，回来接着等原来那张
setTimeout(() => { if(platform === 'netease' && !status.netease.loggedIn && $('#qrFrame').querySelector('svg')) resumeQr(); }, 600);
</script>
